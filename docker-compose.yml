services:
  postgres:
    image: postgres:18
    container_name: tgbot_postgres
    environment:
      # Same names the bot reads, so .env holds one set of credentials instead
      # of two that can drift apart.
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./pgdata:/var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5430:5432"
    command: >
      postgres -c max_connections=100
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.9
               -c wal_buffers=16MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: tgbot_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    # volatile-lru, not the default noeviction: at the limit noeviction starts
    # refusing writes, and the bot would stop being able to save FSM state at
    # all. Everything here has a TTL, so evicting the oldest is the right loss.
    command: >
      redis-server --appendonly yes
                   --maxmemory 256mb
                   --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redisdata: