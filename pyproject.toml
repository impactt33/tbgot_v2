[project]
name = "tbgot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.30",
    "dishka>=1.10",
    "sqlalchemy[asyncio]>=2.0",
    "redis>=5.0",
    "asyncpg>=0.30",
    "alembic>=1.18",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "google-genai>=1.0",
    "tenacity>=9.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["mypy>=1.13", "ruff>=0.8", "pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]

warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "migration.versions.*"
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: обращается к настоящим Gemini/Serper, нужны ключи и сеть",
]